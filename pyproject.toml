[project]
name = "ai-trading-collusion"
version = "0.1.0"
description = "Simplified refabrication of Dou, Goldstein & Ji (2025) 'AI-Powered Trading, Algorithmic Collusion, and Price Efficiency' with extensions on algorithmic heterogeneity."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "pytest>=7.4",
]

[project.optional-dependencies]
deep = [
    "stable-baselines3>=2.2",
    "torch>=2.1",
    "gymnasium>=0.29",
]
dev = [
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_trading"]

# macOS + uv editable-install workaround.
# After `uv sync` (or any `uv run` that triggers a sync), uv sets the macOS
# UF_HIDDEN flag on the editable .pth file
# (.venv/lib/python*/site-packages/_editable_impl_ai_trading_collusion.pth).
# CPython's site.py skips hidden .pth files (see CPython site.addpackage),
# so `import ai_trading` fails despite the package being installed.
# Workaround per terminal session:
#   chflags nohidden .venv/lib/python*/site-packages/_editable_impl_*.pth \
#     && uv run --no-sync python -m ai_trading.simulation.runner --config ...
# Tests via `uv run --no-sync pytest` work for the same reason. Linux/CI are
# unaffected. Tracked upstream as an astral-sh/uv macOS-specific issue.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
