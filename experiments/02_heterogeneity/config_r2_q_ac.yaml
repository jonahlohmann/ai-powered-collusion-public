# R2: the mixed population Q–AC. One tabular Q-learner (agent 0) and one AC learner, a
# tabular softmax actor-critic (agent 1), under the baseline specification
# (params_baseline.yaml). Simulation and IRF blocks are those of
# 01_replicate_baseline/config_r1_baseline.yaml. Settings of the AC learner: the defaults of
# src/ai_trading/agents/actor_critic.py (alpha_actor 0.1, alpha_critic 0.05, entropy_coef 0.1,
# entropy_decay = beta, reward_scale = pi_M). These are setting a of the pilot
# (config_pilot_a.yaml), the setting that the pilot's pick rule selected.
#
# Run, one session per call (i = 0 to 29; seed = seed_base + session id):
#   uv run python -m ai_trading.simulation.runner \
#       --config experiments/02_heterogeneity/config_r2_q_ac.yaml \
#       --session-id-start <i> --n-sim 1 --output-dir results/r2_q_ac/s<i>
# Names recorded at run time in the metadata and logs under results/r2_q_ac/:
# experiment "qa", config_qa.yaml.

experiment:
  name: "r2_q_ac"
  description: "Q–AC population at the baseline specification: tabular Q-learner (agent 0) vs tabular softmax actor-critic (agent 1); 30 sessions"

params: "../shared/params_baseline.yaml"

agents:
  - type: "qlearner"
  - type: "actor_critic"

sweep:
  sigma_u: [1.0]

simulation:
  n_sim: 30
  convergence_periods: 1000000
  max_periods: 100000000
  eval_periods: 100000
  save_eval_periods: 10000
  eval_greedy: true
  check_every: 1000
  seed_base: 42
  session_id_start: 0
  diagnostics:
    enabled: true
    block_periods: 1000000
    onpath_min_share: 0.001
    settled_max_flip_share: 0.10
    trajectory_eval_periods: 20000

irf:
  enabled: true
  pre_periods: 3
  post_periods: 6
  n_trials: 100
  noise:
    units: "price_bins"
    magnitudes: [0.125, 0.25, 0.5]
  deviation:
    enabled: true
    bins: [4, 8]
    agents: [0, 1]

runner:
  log_every: 1000000

output:
  directory: "results/r2_q_ac"

overrides:
  sigma_u: 1.0
  save_qtables: true
  reward_price: "raw"
  market_maker: "rolling_ols"
