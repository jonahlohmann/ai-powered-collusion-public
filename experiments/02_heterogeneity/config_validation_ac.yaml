# Validation run of the AC learner (not one of the 12 runs of the thesis; reported in
# outputs/tables/tab_validation.tex). The AC learner, a tabular softmax actor-critic (agent 0),
# trades against an opponent who always plays the Nash intensity chi^N and never reacts
# (fixed_chi, agent 1). Criterion, fixed before the run, as in config_validation_q.yaml:
# delta_c_agent_0 >= -0.10 and chi_hat_agent_0 >= 152. A learner that misses it points to an
# error in the implementation (the sign of the update or the reward scaling). beta 5e-6 also
# sets the decay of the AC learner's entropy bonus (entropy_decay defaults to beta). 4 sessions.
#
# Run, one session per call (i = 0 to 3; seed = seed_base + session id):
#   uv run python -m ai_trading.simulation.runner \
#       --config experiments/02_heterogeneity/config_validation_ac.yaml \
#       --session-id-start <i> --n-sim 1 --output-dir results/validation_ac/s<i>
# Names recorded at run time in the metadata and logs under results/validation_ac/:
# experiment "br_ac", config_br_ac.yaml.

experiment:
  name: "validation_ac"
  description: "Validation run: actor-critic vs fixed Nash opponent, 4 sessions, beta 5e-6, cap 20M, no IRF"

params: "../shared/params_baseline.yaml"

agents:
  - type: "actor_critic"
  - type: "fixed_chi"
    config:
      chi: "nash"

sweep:
  sigma_u: [1.0]

simulation:
  n_sim: 4
  convergence_periods: 1000000
  max_periods: 20000000
  eval_periods: 100000
  save_eval_periods: 10000
  eval_greedy: true
  check_every: 1000
  seed_base: 42
  session_id_start: 0
  diagnostics:
    enabled: true
    block_periods: 1000000
    onpath_min_share: 0.001
    settled_max_flip_share: 0.10
    trajectory_eval_periods: 20000

irf:
  enabled: false

runner:
  log_every: 1000000

output:
  directory: "results/validation_ac"

overrides:
  sigma_u: 1.0
  beta: 5.0e-6
  save_qtables: true
  reward_price: "raw"
  market_maker: "rolling_ols"
