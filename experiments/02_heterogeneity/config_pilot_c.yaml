# Pilot of the AC learner's settings, setting c (not one of the 12 runs of the thesis). It is
# config_pilot_a.yaml with alpha_actor 0.1 and entropy_coef 0.02 (weaker entropy bonus). Pick
# rule: see config_pilot_a.yaml.
#
# Run, one session per call (i = 0 to 3; seed = seed_base + session id):
#   uv run python -m ai_trading.simulation.runner \
#       --config experiments/02_heterogeneity/config_pilot_c.yaml \
#       --session-id-start <i> --n-sim 1 --output-dir results/pilot_c/s<i>
# Names recorded at run time in the metadata and logs under results/pilot_c/:
# experiment "qa_tune_c", config_qa_tune_c.yaml.

experiment:
  name: "pilot_c"
  description: "Pilot, setting c: Q–AC, 4 sessions, cap 60M, alpha_actor 0.1, entropy_coef 0.02"

params: "../shared/params_baseline.yaml"

agents:
  - type: "qlearner"
  - type: "actor_critic"
    config:
      alpha_actor: 0.1
      entropy_coef: 0.02

sweep:
  sigma_u: [1.0]

simulation:
  n_sim: 4
  convergence_periods: 1000000
  max_periods: 60000000
  eval_periods: 100000
  save_eval_periods: 10000
  eval_greedy: true
  check_every: 1000
  seed_base: 42
  session_id_start: 0
  diagnostics:
    enabled: true
    block_periods: 1000000
    onpath_min_share: 0.001
    settled_max_flip_share: 0.10
    trajectory_eval_periods: 20000

irf:
  enabled: true
  pre_periods: 3
  post_periods: 6
  n_trials: 100
  noise:
    units: "price_bins"
    magnitudes: [0.125, 0.25, 0.5]
  deviation:
    enabled: true
    bins: [4, 8]
    agents: [0, 1]

runner:
  log_every: 1000000

output:
  directory: "results/pilot_c"

overrides:
  sigma_u: 1.0
  save_qtables: true
  reward_price: "raw"
  market_maker: "rolling_ols"
