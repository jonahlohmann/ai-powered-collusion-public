# R1.4: the baseline specification without the lagged price in the state (Dou et al., 2025,
# Section 5.3: DGJ's own check of the price-trigger mechanism).
#
# It is config_r1_baseline.yaml with ONE change: overrides.state_price "none" (the first
# component of every agent's state is 0; prices, rewards and the market maker are unchanged).
# irf.enabled is false because an agent that cannot see the price cannot respond to it (the
# IRF would be zero by construction); the IRF does not affect training.
#
# Run, one session per call (i = 0 to 29; seed = seed_base + session id):
#   uv run python -m ai_trading.simulation.runner \
#       --config experiments/01_replicate_baseline/config_r1_4_no_price.yaml \
#       --session-id-start <i> --n-sim 1 --output-dir results/r1_4_no_price/s<i>
# Names recorded at run time in the metadata and logs under results/r1_4_no_price/:
# experiment "m2_noprice", config_m2_noprice.yaml.

experiment:
  name: "r1_4_no_price"
  description: "R1.4: the baseline specification without the lagged price in the state (state_price none)"

params: "../shared/params_baseline.yaml"

agents:
  - type: "qlearner"
  - type: "qlearner"

sweep:
  sigma_u: [1.0]

simulation:
  n_sim: 30
  convergence_periods: 1000000
  max_periods: 100000000
  eval_periods: 100000
  save_eval_periods: 10000
  eval_greedy: true
  check_every: 1000
  seed_base: 42
  session_id_start: 0
  diagnostics:
    enabled: true
    block_periods: 1000000
    onpath_min_share: 0.001
    settled_max_flip_share: 0.10
    trajectory_eval_periods: 20000

irf:
  enabled: false
  pre_periods: 3
  post_periods: 6
  n_trials: 100
  noise:
    units: "price_bins"
    magnitudes: [0.125, 0.25, 0.5]
  deviation:
    enabled: true
    bins: [4, 8]
    agents: [0, 1]

runner:
  log_every: 1000000

output:
  directory: "results/r1_4_no_price"

overrides:
  sigma_u: 1.0
  save_qtables: true
  reward_price: "raw"
  state_price: "none"
  market_maker: "rolling_ols"
