# R1.1: the earlier specification (../shared/params_earlier_spec.yaml) with training stopped
# early: a convergence window of 100k periods and a cap of 10M periods.
# Rewards on the raw price, DGJ's price grid (Dou et al., 2025, Section 4.2), per-path Δ^C, a
# greedy evaluation window of 100k periods, counterfactual adverse IRF (noise shocks in
# price-bin units and unilateral deviations).
#
# Run all 30 sessions in one process:
#   uv run python -m ai_trading.simulation.runner \
#       --config experiments/01_replicate_baseline/config_r1_1_early_stop.yaml
# Or one session per call (i = 0 to 29; seed = seed_base + session id):
#   uv run python -m ai_trading.simulation.runner \
#       --config experiments/01_replicate_baseline/config_r1_1_early_stop.yaml \
#       --session-id-start <i> --n-sim 1 --output-dir results/r1_1_early_stop/s<i>
# Names recorded at run time in the metadata under results/r1_1_early_stop/: experiment
# "phase0_baseline", config_phase0.yaml. "Phase 0" in the
# description below is the working name of this run.

experiment:
  name: "r1_1_early_stop"
  description: "30-session homogeneous QQ baseline on the corrected Phase 0 pipeline, sigma_u=1.0."

params: "../shared/params_earlier_spec.yaml"

agents:
  - type: "qlearner"
  - type: "qlearner"

sweep:
  sigma_u: [1.0]

simulation:
  n_sim: 30
  convergence_periods: 100000
  max_periods: 10000000
  eval_periods: 100000
  save_eval_periods: 10000
  eval_greedy: true
  check_every: 1000
  seed_base: 42
  session_id_start: 0

irf:
  enabled: true
  pre_periods: 3
  post_periods: 6
  n_trials: 20
  noise:
    units: "price_bins"
    magnitudes: [0.5, 1.0, 2.0, 4.0]
  deviation:
    enabled: true
    bins: [1, 2]
    agents: [0, 1]

runner:
  log_every: 500000

output:
  directory: "results/r1_1_early_stop"

overrides:
  sigma_u: 1.0
  save_qtables: true
  reward_price: "raw"
  market_maker: "rolling_ols"
